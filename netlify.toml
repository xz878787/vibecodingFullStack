[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/openrouter/*"
  to = "https://openrouter.ai/api/v1/:splat"
  status = 200
  force = true
  headers = { "Access-Control-Allow-Origin" = "*", "Access-Control-Allow-Methods" = "GET, POST, OPTIONS", "Access-Control-Allow-Headers" = "Content-Type, Authorization, HTTP-Referer, X-Title" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
